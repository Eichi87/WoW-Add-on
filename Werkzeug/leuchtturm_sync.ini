; Leuchtturm – Einstellungen für leuchtturm_sync.py
; Jeder von euch trägt hier seine eigenen Werte ein.

[leuchtturm]
; WoW-Ordner mit Interface und WTF darin (bei Forever meist ..._forever_)
wow_ordner = C:\Program Files (x86)\World of Warcraft\_forever_

; eigener Spielername – genau wie in Config.lua unter "spieler"
spieler = Daniel

; Kontoordner unter WTF\Account – leer lassen, dann wird er automatisch gefunden
konto =

; Syncthing-Ordner – leer lassen = Interface\AddOns\Leuchtturm_Sync
sync_ordner =

; Prüfabstand in Sekunden
intervall = 5
